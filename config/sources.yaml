# Tier 1: 原始论文、官方机构、官方产品或项目发布。
# Tier 2: 有编辑筛选和技术深度的行业媒体，不可单独支撑深度结论。
# Tier 3: 市场线索；由市场流水线提供，不在本白名单重复配置。

# 分组查询避免所有 arXiv 类别争用同一个 30 条窗口。publisher_id 统一为
# arxiv，确保分类查询与 Hugging Face 精选命中同一论文时只算一个证据来源。
arxiv_sources:
  - id: arxiv_ai_software
    publisher_id: arxiv
    name: "arXiv（AI与软件）"
    tier: 1
    categories: [cs.AI, cs.LG, cs.CL, cs.CV, cs.RO, cs.CR, cs.SE]
  - id: arxiv_compute_systems
    publisher_id: arxiv
    name: "arXiv（芯片、系统与应用物理）"
    tier: 1
    categories: [cs.AR, eess.SY, eess.SP, physics.app-ph, cond-mat.mes-hall]
  - id: arxiv_biotech
    publisher_id: arxiv
    name: "arXiv（计算生物）"
    tier: 1
    categories: [q-bio.BM, q-bio.GN, q-bio.QM]

feeds:
  # 国际实验室、企业和研究机构的一手发布。
  - {id: openai_news, name: OpenAI News, url: "https://openai.com/news/rss.xml", tier: 1, fetch_full_text: true}
  - {id: deepmind_blog, name: Google DeepMind, url: "https://deepmind.google/blog/rss.xml", tier: 1, fetch_full_text: true}
  - {id: ms_research, name: Microsoft Research, url: "https://www.microsoft.com/en-us/research/feed/", tier: 1, fetch_full_text: true}
  - {id: nvidia_blog, name: NVIDIA Blog, url: "https://blogs.nvidia.com/feed/", tier: 1, fetch_full_text: true}
  - {id: huggingface_blog, name: Hugging Face Blog, url: "https://huggingface.co/blog/feed.xml", tier: 1, fetch_full_text: true}
  - {id: mistral_news, name: Mistral AI News, url: "https://mistral.ai/news/rss", tier: 1, fetch_full_text: true}
  - id: meta_newsroom_ai
    name: Meta Newsroom（AI过滤）
    url: "https://about.fb.com/feed/"
    tier: 1
    fetch_full_text: true
    max_items: 15
    include_keywords: [artificial intelligence, AI, Llama, open source model, smart glasses, augmented reality, wearable, data center]
  - {id: mit_ai, name: MIT News AI, url: "https://news.mit.edu/rss/topic/artificial-intelligence2", tier: 1, fetch_full_text: true}
  - {id: nature_ai, name: Nature Machine Intelligence, url: "https://www.nature.com/natmachintell.rss", tier: 1, fetch_full_text: true}
  - {id: nature_biotech, name: Nature Biotechnology, url: "https://www.nature.com/nbt.rss", tier: 1, fetch_full_text: true}
  - {id: us_doe, name: U.S. Department of Energy, url: "https://www.energy.gov/rss.xml", tier: 1, fetch_full_text: true}

  # AI4Science 预印本。先做主题过滤，入选后再提取原文。
  - id: biorxiv_ai4science
    name: bioRxiv（AI4Science过滤）
    url: "https://connect.biorxiv.org/biorxiv_xml.php?subject=all"
    tier: 1
    content_type: paper
    fetch_full_text: true
    include_keywords: [machine learning, artificial intelligence, foundation model, deep learning, protein, genome, genomic, CRISPR, drug, molecule, biotechnology, bioinformatics]

  # 有编辑筛选的行业源，只作为第二来源或产业动态线索。
  - {id: ieee_spectrum, name: IEEE Spectrum, url: "https://spectrum.ieee.org/feeds/feed.rss", tier: 2, fetch_full_text: true}
  - id: toms_hardware_frontier
    name: "Tom's Hardware（前沿硬件过滤）"
    url: "https://www.tomshardware.com/feeds.xml"
    tier: 2
    fetch_full_text: true
    max_items: 15
    include_keywords: [GPU, NPU, accelerator, semiconductor, chip, CPU architecture, data center, inference, AI server, HBM, foundry, lithography]
    exclude_keywords: [deal, save $, lowest price, best buy, amazon]
  - id: cleantechnica_frontier
    name: CleanTechnica（能源技术过滤）
    url: "https://cleantechnica.com/feed/"
    tier: 2
    fetch_full_text: true
    max_items: 15
    include_keywords: [battery, energy storage, grid, solar, fusion, hydrogen, heat pump, renewable, clean energy, nuclear, electricity]

  # 泛读：科技周刊与投稿池。Tier 2/3 不能单独支撑深度结论。
  - id: ruanyf_weekly_issues
    publisher_id: ruanyf_weekly
    name: "阮一峰周刊投稿池"
    url: "https://github.com/ruanyf/weekly/issues.atom"
    tier: 3
    lane: general
    content_type: weekly_issue
    unshorten: true
    fetch_full_text: false
    max_items: 15
    include_keywords: [AI, LLM, GPU, GitHub, open source, model, agent, 开源, 大模型, 工具, 芯片, 机器人, 数据库, 安全, python, rust]
  - id: hacker_newsletter
    publisher_id: hacker_newsletter
    name: Hacker Newsletter
    url: "https://hackernewsletter.com/rss.xml"
    tier: 2
    lane: general
    unshorten: true
    fetch_full_text: false
    max_items: 10
    exclude_keywords: ["who's hiring", "who is hiring", "job", "hiring"]
  - id: import_ai
    publisher_id: import_ai
    name: Import AI
    url: "https://importai.substack.com/feed"
    tier: 2
    lane: general
    unshorten: true
    fetch_full_text: true
    max_items: 8
  - id: tldr_tech
    publisher_id: tldr
    name: TLDR Tech
    url: "https://tldr.tech/rss"
    tier: 2
    lane: general
    unshorten: true
    fetch_full_text: false
    max_items: 10
    include_keywords: [AI, OpenAI, Anthropic, Nvidia, GPU, model, chip, robot, agent, semiconductor, 开源]
  - id: tldr_ai
    publisher_id: tldr
    name: TLDR AI
    url: "https://tldr.tech/ai/rss"
    tier: 2
    lane: general
    unshorten: true
    fetch_full_text: false
    max_items: 10
  - id: golang_weekly
    publisher_id: golang_weekly
    name: Golang Weekly
    url: "https://golangweekly.com/rss/"
    tier: 2
    lane: general
    unshorten: true
    fetch_full_text: false
    max_items: 8
  - id: javascript_weekly
    publisher_id: javascript_weekly
    name: JavaScript Weekly
    url: "https://javascriptweekly.com/rss/"
    tier: 2
    lane: general
    unshorten: true
    fetch_full_text: false
    max_items: 8
  - id: hacker_news_frontpage
    publisher_id: hacker_news
    name: Hacker News
    url: "https://hnrss.org/frontpage"
    tier: 2
    lane: general
    unshorten: true
    fetch_full_text: false
    max_items: 12
    exclude_keywords: ["who's hiring", "who is hiring", "Ask HN", "job", "hiring"]
  - id: ars_technica
    publisher_id: ars_technica
    name: Ars Technica
    url: "https://feeds.arstechnica.com/arstechnica/index"
    tier: 2
    lane: general
    fetch_full_text: false
    max_items: 10
    include_keywords: [AI, chip, GPU, software, security, linux, cloud, open source, semiconductor, robot, model]
  - id: phoronix
    publisher_id: phoronix
    name: Phoronix
    url: "https://www.phoronix.com/rss.php"
    tier: 2
    lane: general
    fetch_full_text: false
    max_items: 8
  - id: infoq_en
    publisher_id: infoq
    name: InfoQ
    url: "https://feed.infoq.com"
    tier: 2
    lane: general
    fetch_full_text: false
    max_items: 8
    include_keywords: [AI, architecture, cloud, kubernetes, database, java, python, rust, javascript, security, devops]
  - id: solidot
    publisher_id: solidot
    name: Solidot
    url: "https://www.solidot.org/index.rss"
    tier: 2
    lane: general
    fetch_full_text: false
    max_items: 10
    include_keywords: [AI, Linux, 开源, 安全, 芯片, 软件, 微软, 谷歌, 苹果, 机器人, 数据库, 编程]

# 没有稳定 RSS 的官方站点通过带 lastmod 的 sitemap 增量采集。
sitemaps:
  - id: anthropic_official
    name: Anthropic News & Research
    url: "https://www.anthropic.com/sitemap.xml"
    tier: 1
    fetch_full_text: true
    fetch_page_metadata: true
    max_items: 15
    include_paths: [/news/, /research/, /engineering/]
    exclude_paths: [/research/team/]
  - id: isomorphic_labs_articles
    name: Isomorphic Labs Articles
    url: "https://www.isomorphiclabs.com/sitemap.xml"
    tier: 1
    fetch_full_text: true
    fetch_page_metadata: true
    max_items: 10
    include_paths: [/articles/]

# 社区排序只负责发现；文档身份、链接和证据仍归属原始 arXiv 论文。
apis:
  - id: huggingface_daily_papers
    type: huggingface_daily_papers
    publisher_id: arxiv
    name: "arXiv（Hugging Face Daily Papers精选）"
    url: "https://huggingface.co/api/daily_papers"
    tier: 1
    max_items: 15

