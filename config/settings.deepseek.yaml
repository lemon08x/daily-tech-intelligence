app:
  title: "科技产业情报日报 · DeepSeek V4 Flash"
  timezone: "Asia/Shanghai"

paths:
  cache_dir: "../data/cache"
  output_dir: "../output"
  intelligence_db: "../data/intelligence_deepseek.db"

intelligence:
  first_run_lookback_hours: 48
  resume_overlap_hours: 6
  cluster_window_hours: 72
  max_items_per_source: 30
  scout_batch_size: 30
  intensive_reading_events: 10
  offline_analysis_events: 500
  preferred_general_events: 5
  preferred_hardcore_events: 5
  preferred_max_per_topic: 2
  preferred_official_release_events: 3
  full_text_max_chars: 50000
  scout_doc_chars: 4000
  title_similarity_threshold: 88
  source_fetch_timeout_seconds: 20
  selection_deterministic_weight: 0.35
  selection_model_weight: 0.65
  selection_repeat_penalty: 0.4
  selection_repeat_hours: 36

github:
  enabled: true
  daily_limit: 8
  weekly_limit: 8
  publish_limit: 10

llm:
  provider: "openai_compatible"
  base_url: "http://192.168.31.236:8000/v1"
  api_key_env: "OMLX_API_KEY"
  prompt_version: "tech-intel-v5"
  scout:
    model: "deepseek-v4-flash-0731"
    extra_body:
      thinking:
        type: enabled
      reasoning_effort: xhigh
    max_output_tokens: 32000
  analyst:
    model: "deepseek-v4-flash-0731"
    extra_body:
      thinking:
        type: enabled
      reasoning_effort: xhigh
    max_output_tokens: 32000
  verifier:
    model: "deepseek-v4-flash-0731"
    extra_body:
      thinking:
        type: enabled
      reasoning_effort: xhigh
    max_output_tokens: 32000
  digest_brief:
    model: "deepseek-v4-flash-0731"
    extra_body:
      thinking:
        type: enabled
      reasoning_effort: xhigh
    max_output_tokens: 32000
  git_brief:
    model: "deepseek-v4-flash-0731"
    extra_body:
      thinking:
        type: enabled
      reasoning_effort: xhigh
    max_output_tokens: 32000
