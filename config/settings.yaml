app:
  title: "科技产业情报日报"
  timezone: "Asia/Shanghai"
  top_news: 10

paths:
  cache_dir: "../data/cache"
  output_dir: "../output"
  intelligence_db: "../data/intelligence.db"

intelligence:
  first_run_lookback_hours: 48
  resume_overlap_hours: 6
  cluster_window_hours: 72
  max_items_per_source: 30
  max_scout_events: 40
  max_deep_events: 10
  max_general_events: 5
  max_hardcore_events: 5
  full_text_max_chars: 50000
  title_similarity_threshold: 88
  source_fetch_timeout_seconds: 20
  selection_deterministic_weight: 0.65
  selection_model_weight: 0.35
  selection_model_reject_floor: 55
  selection_repeat_penalty: 0.4
  selection_repeat_hours: 36

github:
  enabled: true
  daily_limit: 8
  weekly_limit: 8
  publish_limit: 10

quality:
  policy_version: "evidence-gate-v2"
  min_key_facts: 3
  max_key_facts: 6
  min_supported_evidence: 2
  max_supported_evidence: 6
  min_primary_sources: 1
  min_risks: 2
  max_risks: 5
  min_counterpoints: 1
  max_counterpoints: 4
  max_industry_impacts: 4
  downgrade_on_unsupported_claims: true
  max_single_source_confidence: 0.85
  max_deep_confidence: 0.90
  lead_confidence_cap: 0.49
  section_max_chars: 900
  list_item_max_chars: 420
  plain_takeaway_max_chars: 280

llm:
  provider: "openai_compatible"
  base_url: "https://api.deepseek.com"
  api_key_env: "DEEPSEEK_API_KEY"
  prompt_version: "tech-intel-v3"
  scout:
    model: "deepseek-v4-flash"
    max_output_tokens: 6000
    temperature: 0
    extra_body:
      thinking: {type: "disabled"}
      reasoning_effort: "low"
  analyst:
    model: "deepseek-v4-pro"
    max_output_tokens: 6000
    temperature: 0
    extra_body:
      thinking: {type: "enabled"}
      reasoning_effort: "high"
  verifier:
    model: "deepseek-v4-pro"
    max_output_tokens: 3000
    temperature: 0
    extra_body:
      thinking: {type: "enabled"}
      reasoning_effort: "high"
  digest_brief:
    model: "deepseek-v4-flash"
    max_output_tokens: 6000
    temperature: 0
    extra_body:
      thinking: {type: "disabled"}
      reasoning_effort: "low"
  git_brief:
    model: "deepseek-v4-flash"
    max_output_tokens: 4000
    temperature: 0
    extra_body:
      thinking: {type: "disabled"}
      reasoning_effort: "low"
