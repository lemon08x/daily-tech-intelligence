app:
  title: "科技产业情报日报 · Qwen3.8 27B"
  timezone: "Asia/Shanghai"
  top_stocks: 12
  top_industries: 8
  weak_industries: 5
  top_news: 10

paths:
  cache_dir: "../data/cache"
  output_dir: "../output"
  intelligence_db: "../data/intelligence_qwen.db"

market:
  snapshot_providers: ["tencent", "sina"]
  include_beijing_exchange: false
  exclude_name_keywords: ["ST", "退", "N", "C"]
  min_price: 3.0
  max_price: 300.0
  min_daily_change: -5.0
  max_daily_change: 7.0
  min_amount_cny: 100000000
  min_market_cap_cny: 5000000000
  min_turnover_rate: 0.5
  max_turnover_rate: 15.0
  min_pe_ttm: 0.0
  max_pe_ttm: 100.0
  max_pb: 15.0
  min_momentum_60d: -15.0
  max_momentum_60d: 60.0
  factor_weights:
    momentum: 0.30
    value: 0.20
    liquidity: 0.15
    activity: 0.15
    daily_strength: 0.10
    size: 0.10

intelligence:
  first_run_lookback_hours: 48
  resume_overlap_hours: 6
  cluster_window_hours: 72
  max_items_per_source: 30
  max_scout_events: 40
  max_deep_events: 10
  max_general_events: 5
  max_hardcore_events: 5
  max_company_hypotheses: 3
  full_text_max_chars: 50000
  title_similarity_threshold: 88
  source_fetch_timeout_seconds: 20
  publish_leads_when_ai_unavailable: true
  selection_repeat_penalty: 0.4
  selection_repeat_hours: 36

github:
  enabled: true
  daily_limit: 8
  weekly_limit: 8
  publish_limit: 10

llm:
  provider: "openai_compatible"
  base_url: "http://192.168.31.235:8317/v1"
  api_key_env: "QWEN_LAN_API_KEY"
  prompt_version: "tech-intel-v3"
  scout:
    model: "qwen3.8-27b"
    extra_body:
      thinking:
        type: disabled
      reasoning_effort: low
    max_output_tokens: 8000
  verifier:
    model: "qwen3.8-27b"
    extra_body:
      thinking:
        type: enabled
      reasoning_effort: medium
    max_output_tokens: 8000
  analyst:
    model: "qwen3.8-27b"
    extra_body:
      thinking:
        type: enabled
      reasoning_effort: medium
    max_output_tokens: 8000