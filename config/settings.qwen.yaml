app:
  title: "科技产业情报日报 · Qwen3.8 27B"
  timezone: "Asia/Shanghai"
  top_news: 10

paths:
  cache_dir: "../data/cache"
  output_dir: "../output"
  intelligence_db: "../data/intelligence_qwen.db"

intelligence:
  first_run_lookback_hours: 48
  resume_overlap_hours: 6
  cluster_window_hours: 72
  max_items_per_source: 30
  max_scout_events: 40
  max_deep_events: 10
  max_general_events: 5
  max_hardcore_events: 5
  full_text_max_chars: 50000
  scout_doc_chars: 4000
  title_similarity_threshold: 88
  source_fetch_timeout_seconds: 20
  selection_repeat_penalty: 0.4
  selection_repeat_hours: 36

github:
  enabled: true
  daily_limit: 8
  weekly_limit: 8
  publish_limit: 10

llm:
  provider: "openai_compatible"
  base_url: "http://192.168.31.235:8317/v1"
  api_key_env: "QWEN_LAN_API_KEY"
  prompt_version: "tech-intel-v3"
  scout:
    model: "qwen3.8-27b"
    extra_body:
      thinking:
        type: enabled
      # 该端点默认 xhigh；显式传 xhigh 会被改写成 high 并 400。
    max_output_tokens: 32000
  analyst:
    model: "qwen3.8-27b"
    extra_body:
      thinking:
        type: enabled
    max_output_tokens: 32000
  verifier:
    model: "qwen3.8-27b"
    extra_body:
      thinking:
        type: enabled
    max_output_tokens: 32000
  digest_brief:
    model: "qwen3.8-27b"
    extra_body:
      thinking:
        type: enabled
    max_output_tokens: 32000
  git_brief:
    model: "qwen3.8-27b"
    extra_body:
      thinking:
        type: enabled
    max_output_tokens: 32000