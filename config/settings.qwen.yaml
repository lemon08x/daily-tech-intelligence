app:
  title: "科技产业情报日报 · Qwen3.8 27B"
  timezone: "Asia/Shanghai"
  production_experiment_id: "deepseek-v4-flash"

paths:
  cache_dir: "../data/cache"
  output_dir: "../output"
  intelligence_db: "../data/intelligence_qwen.db"

intelligence:
  first_run_lookback_hours: 48
  resume_overlap_hours: 6
  cluster_window_hours: 72
  max_items_per_source: 30
  scout_batch_size: 30
  intensive_reading_events: 10
  offline_analysis_events: 500
  preferred_general_events: 5
  preferred_hardcore_events: 5
  preferred_max_per_topic: 2
  preferred_official_release_events: 3
  full_text_max_chars: 50000
  scout_doc_chars: 4000
  title_similarity_threshold: 88
  source_fetch_timeout_seconds: 20
  selection_deterministic_weight: 0.35
  selection_model_weight: 0.65
  selection_repeat_penalty: 0.4
  selection_repeat_hours: 36
  selection_freshness_0_24h: 1.0
  selection_freshness_24_48h: 0.9
  selection_freshness_48_72h: 0.75

github:
  enabled: true
  daily_limit: 8
  weekly_limit: 8
  publish_limit: 10

llm:
  provider: "openai_compatible"
  base_url: "http://192.168.31.235:8317/v1"
  api_key_env: "QWEN_LAN_API_KEY"
  prompt_version: "tech-intel-v13-reader-value"
  request_timeout_seconds: 1200
  scout:
    model: "qwen3.8-27b"
    extra_body:
      thinking:
        type: enabled
      # 该端点默认 xhigh；显式传 xhigh 会被改写成 high 并 400。
  analyst:
    model: "qwen3.8-27b"
    extra_body:
      thinking:
        type: enabled
  verifier:
    model: "qwen3.8-27b"
    extra_body:
      thinking:
        type: enabled
  digest_brief:
    model: "qwen3.8-27b"
    extra_body:
      thinking:
        type: enabled
  git_brief:
    model: "qwen3.8-27b"
    extra_body:
      thinking:
        type: enabled
