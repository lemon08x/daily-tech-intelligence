app:
  title: "科技产业情报日报 · GPT-6 Luna"
  timezone: "Asia/Shanghai"
  production_experiment_id: "gpt-6-luna-daily"

paths:
  cache_dir: "../data/cache"
  output_dir: "../output"
  intelligence_db: "../data/intelligence_gpt6_luna_daily.db"

intelligence:
  first_run_lookback_hours: 48
  resume_overlap_hours: 6
  cluster_window_hours: 72
  max_items_per_source: 30
  scout_batch_size: 30
  intensive_reading_events: 10
  offline_analysis_events: 500
  preferred_general_events: 5
  preferred_hardcore_events: 5
  preferred_max_per_topic: 2
  preferred_official_release_events: 3
  full_text_max_chars: 50000
  scout_doc_chars: 4000
  title_similarity_threshold: 88
  source_fetch_timeout_seconds: 20
  selection_deterministic_weight: 0.35
  selection_model_weight: 0.65
  selection_min_reader_relevance: 60
  selection_repeat_penalty: 0.4
  selection_repeat_hours: 36
  selection_freshness_0_24h: 1.0
  selection_freshness_24_48h: 0.9
  selection_freshness_48_72h: 0.75

github:
  enabled: true
  daily_limit: 8
  weekly_limit: 8
  publish_limit: 10

broad_reading:
  enabled: true
  prompt_version: "broad-reading-v8-reader-value"
  shortlist_events: 40
  batch_size: 30
  rerank_batch_size: 40
  doc_chars: 1800

quality:
  policy_version: "evidence-gate-v5"
  schema_version: "claim-audit-v2"

llm:
  provider: "openai_compatible"
  base_url: "http://192.168.31.235:8317/v1"
  # Reuse the existing LAN gateway credential; the variable name is historical.
  api_key_env: "QWEN_LAN_API_KEY"
  prompt_version: "tech-intel-v13-reader-value"
  request_timeout_seconds: 1200
  scout:
    model: "gpt-6-luna"
  analyst:
    model: "gpt-6-luna"
  verifier:
    model: "gpt-6-luna"
  digest_brief:
    model: "gpt-6-luna"
  git_brief:
    model: "gpt-6-luna"
